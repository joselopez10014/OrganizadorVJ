[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
 
[tool.poetry]
name = "Precios Almendra"
version = "0.1.0"
description = "Sistema para comparar los precios de las almendras"
readme = "README.md" 
license = "GPL-3.0" 

[tool.poetry.dependencies]
python = "^3.8"
beautifulsoup4 = "^4.12.3"
requests = "^2.32.3"
lxml = "^5.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"